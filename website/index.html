<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/astra_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ASTRA - Adaptive Spectrum Threat Recognition & Analysis. An adaptive scan scheduler for Electronic Support receivers. SIH 2026." />
    <meta name="theme-color" content="#05070b" />
    <title>ASTRA - Adaptive Spectrum Threat Recognition &amp; Analysis</title>
    <script>
      /* no-flash theme bootstrap — dark by default, localStorage wins */
      (function () {
        try {
          var t = localStorage.getItem("astra.theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
